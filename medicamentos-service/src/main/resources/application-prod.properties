# Perfil de producción. Activar con: --spring.profiles.active=prod
# Requiere definir las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.

# El esquema NO se modifica en el arranque: solo valida que exista.
spring.jpa.hibernate.ddl-auto=validate

# No volcar el contenido de las tablas a la consola del servidor.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.thymeleaf.cache=true
