spring.application.name=medicamentos-service
spring.profiles.default=dev

# ---- Base de datos MySQL ----
# Crear antes la base de datos: CREATE DATABASE farmacia_db;
# Las credenciales se toman de variables de entorno (DB_URL, DB_USERNAME,
# DB_PASSWORD); los valores por defecto son SOLO para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmacia_db?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" para desarrollo: crea/ajusta tablas automaticamente a partir de las entidades.
# En producciÃ³n se sobrescribe a "validate" (ver application-prod.properties).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- SesiÃ³n ----
# Expira la sesiÃ³n a los 30 minutos de inactividad.
server.servlet.session.timeout=30m

# ---- Servidor ----
server.port=8082
