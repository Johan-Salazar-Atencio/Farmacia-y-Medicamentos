<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auditoría - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <h2 class="mb-3">Bitácora de auditoría</h2>
    <form class="row g-2 mb-3" method="get" th:action="@{/auditoria}">
        <div class="col-auto">
            <select name="entidad" class="form-select">
                <option value="">Todas las entidades</option>
                <option value="Medicamento" th:selected="${entidadSeleccionada == 'Medicamento'}">Medicamento</option>
                <option value="CategoriaMedicamento" th:selected="${entidadSeleccionada == 'CategoriaMedicamento'}">CategoriaMedicamento</option>
                <option value="LoteMedicamento" th:selected="${entidadSeleccionada == 'LoteMedicamento'}">LoteMedicamento</option>
            </select>
        </div>
        <div class="col-auto"><button type="submit" class="btn btn-outline-secondary">Filtrar</button></div>
    </form>
    <table class="table table-striped align-middle">
        <thead><tr><th>#</th><th>Fecha y hora</th><th>Usuario</th><th>Operación</th><th>Entidad</th><th>ID registro</th><th>Origen</th></tr></thead>
        <tbody>
        <tr th:each="a : ${registros}">
            <td th:text="${a.id}"></td>
            <td th:text="${#temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td th:text="${a.usuario}"></td>
            <td><span class="badge bg-info text-dark" th:text="${a.operacion}"></span></td>
            <td th:text="${a.entidad}"></td>
            <td th:text="${a.registroId}"></td>
            <td class="text-muted small" th:text="${a.detalle}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(registros)}"><td colspan="7" class="text-center text-muted">Aún no hay operaciones auditadas</td></tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
