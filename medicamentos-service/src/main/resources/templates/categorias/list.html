<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Categorías de medicamentos</h2>
        <a class="btn btn-primary" th:href="@{/categorias/nuevo}">+ Nueva categoría</a>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.descripcion}"></td>
            <td><span class="badge" th:classappend="${c.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${c.estado}"></span></td>
            <td class="d-flex gap-1">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                <form th:action="@{/categorias/{id}/estado(id=${c.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-warning" th:text="${c.estado.name() == 'ACTIVO'} ? 'Desactivar' : 'Activar'"></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="5" class="text-center text-muted">No hay categorías registradas</td></tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
