<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lotes - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Lotes de medicamentos</h2>
        <a class="btn btn-primary" th:href="@{/lotes/nuevo}">+ Registrar lote</a>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form class="row g-2 mb-3" method="get" th:action="@{/lotes}">
        <div class="col-auto">
            <select name="medicamentoId" class="form-select">
                <option value="">Todos los medicamentos</option>
                <option th:each="m : ${medicamentos}" th:value="${m.id}" th:text="${m.codigo + ' - ' + m.nombre}"
                        th:selected="${medicamentoSeleccionado != null and medicamentoSeleccionado == m.id}"></option>
            </select>
        </div>
        <div class="col-auto"><button type="submit" class="btn btn-outline-secondary">Filtrar</button></div>
    </form>
    <table class="table table-striped align-middle">
        <thead><tr><th>Medicamento</th><th>N° lote</th><th>Vence</th><th>Cantidad</th><th>Proveedor (id)</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="l : ${lotes}">
            <td th:text="${l.medicamento.nombre}"></td>
            <td th:text="${l.numeroLote}"></td>
            <td th:text="${l.fechaVencimiento}"></td>
            <td th:text="${l.cantidad}"></td>
            <td th:text="${l.proveedorId}"></td>
            <td class="d-flex gap-1">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/lotes/{id}/editar(id=${l.id})}">Editar</a>
                <form th:action="@{/lotes/{id}/eliminar(id=${l.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este lote? Se descontará su cantidad del stock.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lotes)}"><td colspan="6" class="text-center text-muted">No hay lotes registrados</td></tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
