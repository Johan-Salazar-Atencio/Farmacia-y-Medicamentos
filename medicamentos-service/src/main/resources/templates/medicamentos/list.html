<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamentos - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Medicamentos</h2>
        <a class="btn btn-primary" href="/medicamentos/nuevo">+ Nuevo medicamento</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/medicamentos}">
        <div class="col-auto">
            <select name="estado" class="form-select">
                <option value="" th:selected="${estadoSeleccionado == null}">Todos los estados</option>
                <option value="ACTIVO" th:selected="${estadoSeleccionado != null and estadoSeleccionado.name() == 'ACTIVO'}">Activos</option>
                <option value="INACTIVO" th:selected="${estadoSeleccionado != null and estadoSeleccionado.name() == 'INACTIVO'}">Inactivos</option>
            </select>
        </div>
        <div class="col-auto">
            <select name="categoriaId" class="form-select">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${categorias}"
                        th:value="${cat.id}"
                        th:selected="${categoriaSeleccionada != null and categoriaSeleccionada == cat.id}"
                        th:text="${cat.nombre}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Presentación</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="med : ${medicamentos}">
                <td th:text="${med.codigo}"></td>
                <td th:text="${med.nombre}"></td>
                <td th:text="${med.categoria.nombre}"></td>
                <td th:text="${med.presentacion}"></td>
                <td th:text="${'S/ ' + #numbers.formatDecimal(med.precioVenta, 1, 2)}"></td>
                <td>
                    <span th:text="${med.stock}"
                          th:class="${med.stock <= med.stockMinimo} ? 'text-danger fw-semibold' : ''"></span>
                </td>
                <td>
                    <span class="badge" th:classappend="${med.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${med.estado}"></span>
                </td>
                <td class="d-flex gap-1">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/medicamentos/{id}/editar(id=${med.id})}">Editar</a>
                    <form th:action="@{/medicamentos/{id}/estado(id=${med.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-warning">
                            <span th:text="${med.estado.name() == 'ACTIVO'} ? 'Desactivar' : 'Activar'"></span>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicamentos)}">
                <td colspan="8" class="text-center text-muted">No hay medicamentos que coincidan con el filtro</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
