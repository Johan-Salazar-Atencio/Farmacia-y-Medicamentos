spring.application.name=demo

# ---- Base de datos MySQL ----
# Crear antes la base de datos: CREATE DATABASE farmacia_db;
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia_db?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" para desarrollo: crea/ajusta tablas automaticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Servidor ----
server.port=8080
