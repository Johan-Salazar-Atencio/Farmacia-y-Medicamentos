<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categoría - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <h2 th:text="${form.id == null} ? 'Nueva categoría' : 'Editar categoría'"></h2>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form th:action="@{/categorias/guardar}" th:object="${form}" method="post" class="row g-3" novalidate>
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="100" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" maxlength="255" rows="2"></textarea>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/categorias" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
