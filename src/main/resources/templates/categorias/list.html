<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Categorías de medicamentos</h2>
        <a class="btn btn-primary" href="/categorias/nueva">+ Nueva categoría</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.nombre}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <span class="badge" th:classappend="${cat.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${cat.estado}"></span>
                </td>
                <td class="d-flex gap-1">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/categorias/{id}/editar(id=${cat.id})}">Editar</a>
                    <form th:action="@{/categorias/{id}/estado(id=${cat.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-warning">
                            <span th:text="${cat.estado.name() == 'ACTIVO'} ? 'Desactivar' : 'Activar'"></span>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="text-center text-muted">Aún no hay categorías registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
