<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/medicamentos">💊 Farmacia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/medicamentos">Medicamentos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/proveedores">Proveedores</a></li>
                <li class="nav-item"><a class="nav-link" href="/lotes">Lotes</a></li>
                <li class="nav-item"><a class="nav-link" href="/lotes/nuevo">Registrar lote</a></li>
                <li class="nav-item"><a class="nav-link" href="/alertas">Alertas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted small py-4 mt-4">
    Sistema de Gestión Hospitalaria &middot; Módulo de Farmacia
</footer>

</body>
</html>
