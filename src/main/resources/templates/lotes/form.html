<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar lote - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <h2>Registrar lote de medicamento</h2>
    <p class="text-muted">Al guardar, la cantidad ingresada se sumará automáticamente al stock del medicamento seleccionado.</p>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form th:action="@{/lotes/guardar}" th:object="${form}" method="post" class="row g-3" novalidate>

        <div class="col-md-6">
            <label class="form-label">Medicamento *</label>
            <select class="form-select" th:field="*{medicamentoId}"
                    th:classappend="${#fields.hasErrors('medicamentoId')} ? 'is-invalid'" required>
                <option value="">Seleccione un medicamento</option>
                <option th:each="med : ${medicamentos}" th:value="${med.id}"
                        th:text="${med.codigo + ' - ' + med.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('medicamentoId')}" th:errors="*{medicamentoId}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Proveedor *</label>
            <select class="form-select" th:field="*{proveedorId}"
                    th:classappend="${#fields.hasErrors('proveedorId')} ? 'is-invalid'" required>
                <option value="">Seleccione un proveedor</option>
                <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.razonSocial}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('proveedorId')}" th:errors="*{proveedorId}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Número de lote *</label>
            <input type="text" class="form-control" th:field="*{numeroLote}"
                   th:classappend="${#fields.hasErrors('numeroLote')} ? 'is-invalid'" maxlength="50" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroLote')}" th:errors="*{numeroLote}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Cantidad *</label>
            <input type="number" min="1" class="form-control" th:field="*{cantidad}"
                   th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Precio de compra (S/)</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precioCompra}"/>
        </div>

        <div class="col-md-4">
            <label class="form-label">Fecha de vencimiento *</label>
            <input type="date" class="form-control" th:field="*{fechaVencimiento}"
                   th:classappend="${#fields.hasErrors('fechaVencimiento')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></div>
            <small class="text-muted">Debe ser posterior a la fecha actual</small>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Registrar lote</button>
            <a href="/lotes" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
