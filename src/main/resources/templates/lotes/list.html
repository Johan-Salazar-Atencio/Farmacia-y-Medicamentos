<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lotes - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Lotes vigentes</h2>
        <a class="btn btn-primary" href="/lotes/nuevo">+ Registrar lote</a>
    </div>
    <p class="text-muted">Solo se muestran lotes activos y no vencidos. Los vencidos aparecen en <a href="/alertas">Alertas</a>.</p>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Medicamento</th>
                <th>N.° lote</th>
                <th>Proveedor</th>
                <th>Cantidad</th>
                <th>Vencimiento</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lote : ${lotes}">
                <td th:text="${lote.medicamento.codigo + ' - ' + lote.medicamento.nombre}"></td>
                <td th:text="${lote.numeroLote}"></td>
                <td th:text="${lote.proveedor.razonSocial}"></td>
                <td th:text="${lote.cantidad}"></td>
                <td th:text="${#temporals.format(lote.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                <td>
                    <form th:action="@{/lotes/{id}/anular(id=${lote.id})}" method="post"
                          onsubmit="return confirm('¿Anular este lote? Se descontará su cantidad del stock.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Anular</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lotes)}">
                <td colspan="6" class="text-center text-muted">No hay lotes vigentes registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
