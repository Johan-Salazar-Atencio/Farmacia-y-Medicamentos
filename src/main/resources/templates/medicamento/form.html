<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamento - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <h2 th:text="${form.id == null} ? 'Nuevo medicamento' : 'Editar medicamento'"></h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form th:action="@{/medicamentos/guardar}" th:object="${form}" method="post" class="row g-3" novalidate>
        <input type="hidden" th:field="*{id}"/>
        <div class="col-md-4">
            <label class="form-label">Código *</label>
            <input type="text" class="form-control" th:field="*{codigo}"
                   th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'" maxlength="30" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
        </div>
        <div class="col-md-8">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="150" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="col-md-8">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control" th:field="*{descripcion}" maxlength="255"/>
        </div>
        <div class="col-md-4">
            <label class="form-label">Precio de venta *</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precioVenta}"
                   th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoriaId}">
                <option value="">-- Sin categoría --</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
            </select>
        </div>
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/medicamentos" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
