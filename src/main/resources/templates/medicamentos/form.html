<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Medicamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🏥 Sistema Hospitalario - Módulo Farmacia</span>
    </div>
</nav>

<div class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/medicamentos}">Medicamentos</a></li>
            <li class="breadcrumb-item active">Registrar / Modificar</li>
        </ol>
    </nav>

    <div class="card shadow-sm" style="max-width: 700px;">
        <div class="card-header bg-white">
            <h4 class="mb-0 text-secondary">Datos del Medicamento</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Código interno</label>
                        <input type="text" class="form-control" th:field="*{codigoInterno}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre comercial</label>
                        <input type="text" class="form-control" th:field="*{nombreComercial}"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Principio activo</label>
                        <input type="text" class="form-control" th:field="*{principioActivo}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Concentración</label>
                        <input type="text" class="form-control" th:field="*{concentracion}"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Forma farmacéutica</label>
                        <input type="text" class="form-control" th:field="*{formaFarmaceutica}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Presentación</label>
                        <input type="text" class="form-control" th:field="*{presentacion}"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Laboratorio</label>
                        <input type="text" class="form-control" th:field="*{laboratorio}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Categoría</label>
                        <input type="text" class="form-control" th:field="*{categoria}"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Unidad de medida</label>
                        <input type="text" class="form-control" th:field="*{unidadMedida}"/>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{requiereReceta}"/>
                            <label class="form-check-label">Requiere receta</label>
                        </div>
                    </div>
                </div>

                <hr>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/medicamentos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</div>

</body>
</html>
