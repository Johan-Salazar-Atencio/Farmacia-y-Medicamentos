<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamento - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <h2 th:text="${form.id == null} ? 'Nuevo medicamento' : 'Editar medicamento'"></h2>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="row mb-3" th:if="${codigoActual != null}">
        <div class="col-auto"><span class="badge bg-info text-dark">Código: <strong th:text="${codigoActual}"></strong></span></div>
        <div class="col-auto"><span class="badge bg-light text-dark border">Stock actual: <strong th:text="${stockActual}"></strong> (se actualiza al registrar lotes)</span></div>
    </div>
    <p class="text-muted" th:if="${codigoActual == null}">El código se generará automáticamente al guardar (formato MED-00001).</p>

    <form th:action="@{/medicamentos/guardar}" th:object="${form}" method="post" class="row g-3" novalidate>
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="150" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Categoría *</label>
            <select class="form-select" th:field="*{categoriaId}"
                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'" required>
                <option value="">Seleccione una categoría</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" maxlength="255" rows="2"></textarea>
        </div>

        <div class="col-md-4">
            <label class="form-label">Presentación *</label>
            <input type="text" class="form-control" th:field="*{presentacion}"
                   th:classappend="${#fields.hasErrors('presentacion')} ? 'is-invalid'"
                   placeholder="Tabletas, jarabe, ampolla..." maxlength="80" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('presentacion')}" th:errors="*{presentacion}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Concentración</label>
            <input type="text" class="form-control" th:field="*{concentracion}" placeholder="500mg" maxlength="80"/>
        </div>

        <div class="col-md-2">
            <label class="form-label">Precio de venta (S/) *</label>
            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{precioVenta}"
                   th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
        </div>

        <div class="col-md-2">
            <label class="form-label">Stock mínimo *</label>
            <input type="number" min="0" class="form-control" th:field="*{stockMinimo}"
                   th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/medicamentos" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
