<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamentos - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🏥 Sistema Hospitalario - Módulo Farmacia</span>
    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-secondary">Medicamentos</h2>
        <a th:href="@{/medicamentos/nuevo}" class="btn btn-success">+ Nuevo medicamento</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Nombre comercial</th>
                    <th>Categoría</th>
                    <th>Presentación</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="med : ${medicamentos}">
                    <td th:text="${med.codigoInterno}"></td>
                    <td th:text="${med.nombreComercial}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${med.categoria}"></span></td>
                    <td th:text="${med.presentacion}"></td>
                    <td class="text-end">
                        <a th:href="@{/medicamentos/editar/{id}(id=${med.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(medicamentos)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay medicamentos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
