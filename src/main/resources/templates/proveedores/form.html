<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedor - Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container">
    <h2 th:text="${form.id == null} ? 'Nuevo proveedor' : 'Editar proveedor'"></h2>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form th:action="@{/proveedores/guardar}" th:object="${form}" method="post" class="row g-3" novalidate>
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-4">
            <label class="form-label">RUC *</label>
            <input type="text" class="form-control" th:field="*{ruc}"
                   th:classappend="${#fields.hasErrors('ruc')} ? 'is-invalid'" maxlength="11" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
        </div>

        <div class="col-md-8">
            <label class="form-label">Razón social *</label>
            <input type="text" class="form-control" th:field="*{razonSocial}"
                   th:classappend="${#fields.hasErrors('razonSocial')} ? 'is-invalid'" maxlength="150" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" th:field="*{telefono}"
                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'" maxlength="20"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" maxlength="100"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}" maxlength="200"/>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/proveedores" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
